<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Portada · Cota Mil Rush</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    /* Gráfico de funciones de Play Store: 1024 × 500 */
    .cover {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: radial-gradient(70% 90% at 15% 20%, #1d3b6e 0%, transparent 60%), #0b0f17;
    }
    canvas { position: absolute; inset: 0; }
    .shade {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(9,12,19,.97) 0%, rgba(9,12,19,.9) 34%, rgba(9,12,19,.0) 56%);
    }
    .text { position: absolute; left: 56px; top: 50%; transform: translateY(-50%); width: 430px; color: #fff; }
    .eyebrow {
      display: inline-flex; gap: 8px; align-items: center;
      margin: 0 0 14px; padding: 6px 12px; border-radius: 999px;
      background: rgba(91,155,255,.16); color: #9cc2ff;
      font: 700 13px "JetBrains Mono", monospace; letter-spacing: .06em;
    }
    h1 { margin: 0; font-size: 92px; font-weight: 800; line-height: .9; letter-spacing: -.04em; }
    h1 span {
      display: block;
      background: linear-gradient(90deg, #5b9bff 0%, #82b3ff 50%, #facc15 100%);
      width: max-content;
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tag { margin: 18px 0 22px; font-size: 20px; line-height: 1.35; color: #c9d1dc; font-weight: 600; }
    .tag b { color: #facc15; }
    .cta {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 22px; border-radius: 14px;
      background: #5b9bff; color: #0b0d10; font-weight: 800; font-size: 18px;
      box-shadow: 0 10px 30px rgba(91,155,255,.4);
    }
  </style>
</head>
<body>
  <div class="cover" id="cover">
    <canvas id="c" width="1024" height="500"></canvas>
    <div class="shade"></div>
    <div class="text">
      <p class="eyebrow">🚗 AUTOPISTA DE CARACAS</p>
      <h1>COTA MIL<span>RUSH</span></h1>
      <p class="tag">Esquiva huecos y motorizados.<br>¡Agarra la <b>⭐ estrella</b> y vuélvete invencible!</p>
      <span class="cta">▶ Juega gratis</span>
    </div>
  </div>
  <script type="module">
    import * as s from "/src/render/sprites.ts";
    const canvas = document.getElementById("c");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = 1024 * dpr; canvas.height = 500 * dpr;
    canvas.style.width = "1024px"; canvas.style.height = "500px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    // Escena en unidades del juego: vía de 3 carriles (ancho 200) muy larga
    const ROAD = 200, L = ROAD / 3, lane = (i) => L * i + L / 2;
    ctx.translate(745, 250);
    ctx.rotate(0.2);
    ctx.scale(1.3, 1.3);
    ctx.translate(-ROAD / 2, -250);

    const top = -400, bottom = 900;
    ctx.fillStyle = "#2f5d3a"; ctx.fillRect(-400, top, ROAD + 800, bottom - top);
    ctx.fillStyle = "#9aa3ad"; ctx.fillRect(-14, top, 14, bottom - top); ctx.fillRect(ROAD, top, 14, bottom - top);
    ctx.fillStyle = "#87909b";
    for (let y = top; y < bottom; y += 28) { ctx.fillRect(-14, y, 14, 1); ctx.fillRect(ROAD, y, 14, 1); }
    for (let y = top; y < bottom; y += 120) {
      for (const x of [-36, -90, ROAD + 36, ROAD + 90]) {
        ctx.fillStyle = "#24492d"; ctx.beginPath(); ctx.arc(x, y + (x > 0 ? 40 : 0), 17, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#3e7a4c"; ctx.beginPath(); ctx.arc(x - 3, y - 3 + (x > 0 ? 40 : 0), 11, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "#fde68a";
      for (const x of [-7, ROAD + 7]) { ctx.beginPath(); ctx.arc(x, y + 60, 3, 0, Math.PI * 2); ctx.fill(); }
    }
    const g = ctx.createLinearGradient(0, 0, ROAD, 0);
    g.addColorStop(0, "#2b2f36"); g.addColorStop(0.5, "#353a42"); g.addColorStop(1, "#2b2f36");
    ctx.fillStyle = g; ctx.fillRect(0, top, ROAD, bottom - top);
    ctx.fillStyle = "#facc15"; ctx.fillRect(3, top, 3, bottom - top); ctx.fillRect(ROAD - 6, top, 3, bottom - top);
    ctx.fillStyle = "#e5e7eb";
    for (const i of [1, 2]) for (let y = top; y < bottom; y += 48) ctx.fillRect(L * i - 1.5, y, 3, 24);

    // Líneas de velocidad
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 2;
    for (const [x, y, l] of [[20, 80, 60], [180, 30, 70], [95, -60, 50], [150, 210, 55], [40, 380, 45], [190, 470, 60], [120, 520, 40]]) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + l); ctx.stroke();
    }

    // Tráfico y premios
    s.car(ctx, lane(0), 30, "#a855f7");
    for (const [y, spin] of [[70, 1], [110, 2.2], [150, 0.4]]) s.coin(ctx, lane(2), y, spin);
    ctx.save(); ctx.translate(lane(0), 170); ctx.scale(1.5, 1.5); s.star(ctx, 0, 0, 0.2); ctx.restore();
    s.car(ctx, lane(2), 255, "#f59e0b");
    s.pothole(ctx, lane(0), 300);
    s.moto(ctx, lane(0), 440);
    s.pothole(ctx, lane(2), 420);

    // Carro invencible rompiendo un cono justo delante
    const px = lane(1), py = 360;
    s.starAura(ctx, px, py, 0.35, 7);
    s.car(ctx, px, py, "#facc15", true);
    const colors = ["#f97316", "#fbbf24", "#f472b6", "#60a5fa", "#4ade80", "#ffffff"];
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 40; i++) {
      const a = -Math.PI / 2 + (rnd() - 0.5) * 2.4, d = 10 + rnd() * 42, r = 1.4 + rnd() * 2.6;
      ctx.fillStyle = colors[i % colors.length];
      ctx.globalAlpha = 0.6 + rnd() * 0.4;
      ctx.fillRect(px + Math.cos(a) * d - r, py - 42 + Math.sin(a) * d * 0.7 - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    document.fonts.ready.then(() => document.body.dataset.ready = "1");
  </script>
</body>
</html>
